# Tatman Vet Store — Render Static Site (separate from LIMS)

Create this as a **new Static Site** in the existing Render account.
Do not apply this file as a Blueprint on the LIMS service.

services:
  - type: web
    name: tatman-vet-store
    runtime: static
    plan: starter
    region: frankfurt
    rootDir: tatman-store
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - tatman-store/**
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /brand/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
